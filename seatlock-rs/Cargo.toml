[package]
name = "seatlock-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port of seatlock (event seat holds with expiring holds and idempotent retries)"
license = "MIT"
publish = false

[features]
default = []
# Allocator experiments for the memory write-up (exactly one at a time; glibc malloc otherwise).
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

mimalloc = { version = "0.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
